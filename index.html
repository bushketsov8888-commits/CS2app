<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAVARU CS EXPERT v2.0</title>
    <style>
        :root {
            --bg-main: #121316;
            --bg-card: #1a1c22;
            --brand-orange: #ff5500;
            --brand-orange-glow: rgba(255, 85, 0, 0.2);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --accent-green: #00cc66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; min-height: 100vh; position: relative; padding-bottom: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #252830; padding-bottom: 12px; }
        .logo-box h1 { font-size: 18px; font-weight: 800; text-transform: uppercase; }
        .logo-box span { color: var(--brand-orange); text-shadow: 0 0 10px var(--brand-orange-glow); }
        .winrate-badge { background: linear-gradient(135deg, #252830, #1a1c22); border: 1px solid var(--brand-orange); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .winrate-badge em { color: var(--accent-green); font-style: normal; }
        #matches-container { display: flex; flex-direction: column; gap: 16px; }
        .match-card { background-color: var(--bg-card); border-radius: 14px; border: 1px solid #252830; padding: 16px; position: relative; overflow: hidden; }
        .match-status { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }
        .status-live { color: var(--brand-orange); display: flex; align-items: center; gap: 4px; }
        .status-live::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--brand-orange); border-radius: 50%; }
        .teams-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .team-row { display: flex; align-items: center; gap: 10px; width: 42%; }
        .team-row.right { flex-direction: row-reverse; text-align: right; }
        .team-logo { width: 36px; height: 36px; background-color: #252830; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; border: 1px solid #323642; }
        .team-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .match-score { font-size: 20px; font-weight: 800; text-align: center; width: 16%; }
        .osint-graph-box { margin-bottom: 14px; background: #121316; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
        .graph-row { display: flex; flex-direction: column; gap: 4px; }
        .graph-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); font-weight: 600; }
        .bar-container { width: 100%; height: 6px; background-color: #252830; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 3px; }
        .bar-fill.t1 { background: linear-gradient(90deg, #ff5500, #ffaa00); }
        .bar-fill.t2 { background: linear-gradient(90deg, #00cc66, #00ffcc); }
        .analytics-block { background-color: #121316; border-radius: 10px; padding: 12px; margin-bottom: 12px; border-left: 3px solid var(--brand-orange); }
        .analytics-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .label { color: var(--text-muted); }
        .value { font-weight: 600; }
        .value.highlight { color: var(--brand-orange); }
        .odds-container { display: flex; gap: 8px; }
        .odds-btn { flex: 1; background-color: #252830; border: 1px solid #323642; color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
        .odds-btn span { color: var(--text-muted); font-weight: 400; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-box"><h1>LAVARU <span>CS EXPERT</span></h1></div>
        <div class="winrate-badge">W/R (30д): <em>74.2%</em></div>
    </div>
    <div id="matches-container"></div>
    <script>
        function decodeAndLoadConfig() {
            const urlParams = new URLSearchParams(window.location.search);
            const payload = urlParams.get('payload');
            const container = document.getElementById('matches-container');

            if (!payload) {
                const sampleMatches = [
                    { t: "ESL Pro League S24", status: "LIVE · КАРТА 1", team1: "FaZe Clan", team2: "G2 Esports", score: "11:8", p1: 76, p2: 23, t1_tonus: 88, t2_tonus: 52, rec: "ТБ 21.5 (2500р)", o1: "1.65", o2: "2.25", uid: "506463187" },
                    { t: "BLAST Premier World Final", status: "18:30 (СЕГОДНЯ)", team1: "Natus Vincere", team2: "Team Vitality", score: "0:0", p1: 52, p2: 48, t1_tonus: 94, t2_tonus: 91, rec: "П1 по Келли (1200р)", o1: "1.85", o2: "1.95", uid: "506463187" }
                ];
                renderMatches(sampleMatches);
                return;
            }

            try {
                // Декодируем безопасный Base64 в байты и собираем UTF-8 строку без искажений кириллицы
                const binaryString = atob(decodeURIComponent(payload));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const jsonString = new TextDecoder('utf-8').decode(bytes);
                const matchesArray = JSON.parse(jsonString);
                renderMatches(matchesArray);
            } catch (e) {
                console.error("Критическая ошибка декодирования Base64:", e);
                container.innerHTML = "<div style='text-align:center;color:#ff5500;padding:20px;font-weight:700;'>ОШИБКА ДЕКОДИРОВАНИЯ ЛЕНТЫ МАТЧЕЙ</div>";
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById('matches-container');
            container.innerHTML = "";

            matches.forEach((m, index) => {
                const card = document.createElement('div');
                card.className = "match-card";
                
                const ico1 = (m.team1 || "T1").substring(0, 4).toUpperCase();
                const ico2 = (m.team2 || "T2").substring(0, 4).toUpperCase();

                card.innerHTML = `
                    <div class="match-status">
                        <span class="${m.status && m.status.includes('LIVE') ? 'status-live' : ''}">${m.status || 'Предстоящий'}</span>
                        <span>${m.t || 'Турнир'}</span>
                    </div>
                    <div class="teams-container">
                        <div class="team-row">
                            <div class="team-logo">${ico1}</div>
                            <div class="team-name">${m.team1 || 'Команда 1'}</div>
                        </div>
                        <div class="match-score">${m.score || '0:0'}</div>
                        <div class="team-row right">
                            <div class="team-logo">${ico2}</div>
                            <div class="team-name">${m.team2 || 'Команда 2'}</div>
                        </div>
                    </div>
                    
                    <div class="osint-graph-box">
                        <div class="graph-row">
                            <div class="graph-labels">
                                <span>Тонус Игроков / Активность в Steam</span>
                                <span>${m.t1_tonus || 50}%</span>
                            </div>
                            <div class="bar-container">
                                <div class="bar-fill t1" style="width: ${m.t1_tonus || 50}%"></div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-labels">
                                <span>Психологический фон / Моральное состояние</span>
                                <span>${m.t2_tonus || 50}%</span>
                            </div>
                            <div class="bar-container">
                                <div class="bar-fill t2" style="width: ${m.t2_tonus || 50}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="analytics-block">
                        <div class="analytics-row">
                            <span class="label">Шансы ИИ (Live + OSINT):</span>
                            <span class="value">${m.p1 || 50}% vs ${m.p2 || 50}%</span>
                        </div>
                        <div class="analytics-row">
                            <span class="label">Рекомендация по Келли:</span>
                            <span class="value highlight">${m.rec || 'Расчет...'}</span>
                        </div>
                    </div>
                    <div class="odds-container">
                        <div class="odds-btn"><span>П1</span> ${m.o1 || '--'}</div>
                        <div class="odds-btn"><span>П2</span> ${m.o2 || '--'}</div>
                    </div>
                `;

                container.appendChild(card);

                if (index === 0 && m.uid) {
                    const watermark = document.createElement('div');
                    watermark.style.position = 'fixed';
                    watermark.style.top = '50%';
                    watermark.style.left = '50%';
                    watermark.style.transform = 'translate(-50%, -50%) rotate(-45deg)';
                    watermark.style.opacity = '0.015';
                    watermark.style.fontSize = '24px';
                    watermark.style.fontWeight = '800';
                    watermark.style.color = '#ffffff';
                    watermark.style.pointerEvents = 'none';
                    watermark.style.zIndex = '1';
                    watermark.style.whiteSpace = 'nowrap';
                    watermark.innerText = 'LAVARU SYSTEM · ID ' + m.uid;
                    document.body.appendChild(watermark);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', decodeAndLoadConfig);
    </script>
</body>
</html>
