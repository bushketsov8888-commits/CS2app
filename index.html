<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAVARU CS EXPERT v1.0</title>
    <style>
        :root {
            --bg-main: #121316; /* Глубокий антрацит */
            --bg-card: #1a1c22; /* Графитовые плитки */
            --brand-orange: #ff5500; /* Неоновый оранжевый */
            --brand-orange-glow: rgba(255, 85, 0, 0.2);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --accent-green: #00cc66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 30px;
        }

        /* Шапка приложения */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #252830;
            padding-bottom: 12px;
        }

        .logo-box h1 {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logo-box span {
            color: var(--brand-orange);
            text-shadow: 0 0 10px var(--brand-orange-glow);
        }

        .winrate-badge {
            background: linear-gradient(135deg, #252830, #1a1c22);
            border: 1px solid var(--brand-orange);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 0 8px var(--brand-orange-glow);
        }

        .winrate-badge em {
            color: var(--accent-green);
            font-style: normal;
        }

        /* Карточка матча */
        .match-card {
            background-color: var(--bg-card);
            border-radius: 14px;
            border: 1px solid #252830;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:active {
            transform: scale(0.99);
            border-color: var(--brand-orange);
        }

        .match-status {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .status-live {
            color: var(--brand-orange);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-live::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--brand-orange);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        /* Команды */
        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 42%;
        }

        .team-row.right {
            flex-direction: row-reverse;
            text-align: right;
        }

        .team-logo {
            width: 36px;
            height: 36px;
            background-color: #252830;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
font-weight: 700;
            font-size: 12px;
            border: 1px solid #323642;
        }

        .team-name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .match-score {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 2px;
            text-align: center;
            width: 16%;
        }

        /* Аналитический блок (AI OSINT) */
        .analytics-block {
            background-color: #121316;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 3px solid var(--brand-orange);
        }

        .analytics-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .analytics-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-muted);
        }

        .value {
            font-weight: 600;
        }

        .value.highlight {
            color: var(--brand-orange);
        }

        /* Кнопка действия / Коэффициенты */
        .odds-container {
            display: flex;
            gap: 8px;
        }

        .odds-btn {
            flex: 1;
            background-color: #252830;
            border: 1px solid #323642;
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            transition: all 0.15s ease;
        }

        .odds-btn:active {
            background-color: var(--brand-orange);
            border-color: var(--brand-orange);
            box-shadow: 0 0 10px var(--brand-orange-glow);
        }

        .odds-btn span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .odds-btn:active span {
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <div class="logo-box">
            <h1>LAVARU <span>CS EXPERT</span></h1>
        </div>
        <div class="winrate-badge">
            W/R (30д): <em>74.2%</em>
        </div>
    </div>

    <!-- Пример карточки LIVE матча -->
    <div class="match-card">
        <div class="match-status">
            <span class="status-live">Матч в эфире · Карта 1</span>
            <span>PGL Major 2026</span>
        </div>
        
        <div class="teams-container">
            <div class="team-row">
                <div class="team-logo">FaZe</div>
                <div class="team-name">FaZe Clan</div>
            </div>
            <div class="match-score">10:7</div>
            <div class="team-row right">
                <div class="team-logo">G2</div>
                <div class="team-name">G2 Esports</div>
            </div>
        </div>

        <!-- OSINT Аналитика ИИ -->
        <div class="analytics-block">
            <div class="analytics-row">
                <span class="label">Вероятность (Live + OSINT):</span>
                <span class="value">FaZe 58% vs 42% G2</span>
            </div>
            <div class="analytics-row">
                <span class="label">Фактор камбэка (Loss Bonus):</span>
                <span class="value">Высокий (У G2 сломана экономика)</span>
            </div>
            <div class="analytics-row">
                <span class="label">Рекомендация (Критерий Келли):</span>
                <span class="value highlight">ТБ 21.5 раундов (4.2% от банка)</span>
            </div>
        </div>

        <!-- Быстрые исходы -->
<div class="odds-container">
            <div class="odds-btn"><span>П1</span> 1.65</div>
            <div class="odds-btn"><span>П2</span> 2.25</div>
        </div>
    </div>

</body>
</html>
