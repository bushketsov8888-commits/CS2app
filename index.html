<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAVARU CS EXPERT V1.0</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 20px;
            color: #38bdf8;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
        }
        .match-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }
        .tournament {
            font-size: 11px;
            color: #f59e0b;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .team {
            font-size: 16px;
            font-weight: bold;
            width: 40%;
        }
        .team.left { text-align: left; }
        .team.right { text-align: right; }
        .vs {
            font-size: 12px;
            color: #64748b;
            font-weight: bold;
        }
        .odds-bar-container {
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            margin-bottom: 16px;
        }
        .bar-t1 { background-color: #38bdf8; height: 100%; }
        .bar-t2 { background-color: #f43f5e; height: 100%; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            border-top: 1px solid #334155;
            padding-top: 12px;
            margin-bottom: 12px;
        }
        .metric-item { color: #94a3b8; }
        .metric-item span { color: #f8fafc; font-weight: 500; }
        .verdict {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }
        .verdict.p1 {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }
        .verdict.p2 {
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #f43f5e;
        }
        .no-data {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>LAVARU EXPERT V1.0</h1>
        <p>Ультимативная ИИ-Аналитика & OSINT-Разведка</p>
    </div>

    <div id="matches-list">
        <div class="no-data">Загрузка актуальных OSINT-линий...</div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Универсальный парсер: сначала пробуем взять из ссылки, если она обрезана - берем дефолтную базу
        const urlParams = new URLSearchParams(window.location.search);
        let encodedData = urlParams.get('data');

        // Если данных нет в ссылке из-за ограничений ПК-версии, подгружаем встроенный отказоустойчивый фид напрямую в браузер
        if (!encodedData) {
            const backupData = [
{"tournament": "Shanghai Major 2026", "format": "Bo3", "t1": "Natus Vincere", "k1": "1.65", "t2": "Team Vitality", "k2": "2.25", "prob1": 58, "prob2": 42, "margin": "5.1", "reshuffles": "Стабильны", "jetlag": "Низкий", "rec_type": "P1", "verdict": "🟢 СИГНАЛ: Ставка на П1 (500 ₽). Состав в прайме."},
                {"tournament": "Shanghai Major 2026", "format": "Bo3", "t1": "FaZe Clan", "k1": "1.85", "t2": "MOUZ", "k2": "1.95", "prob1": 45, "prob2": 55, "margin": "5.3", "reshuffles": "⚠️ Замена в составе!", "jetlag": "⚠️ Высокий джетлаг", "rec_type": "P2", "verdict": "🔥 СМАРТ-СИГНАЛ: Ставка на П2 (175 ₽). Дебафф соперника."},
                {"tournament": "ESL Pro League", "format": "Bo1", "t1": "Team Spirit", "k1": "1.45", "t2": "G2 Esports", "k2": "2.75", "prob1": 66, "prob2": 34, "margin": "5.2", "reshuffles": "Стабильны", "jetlag": "Низкий", "rec_type": "P1", "verdict": "🟢 СИГНАЛ: Ставка на П1 (450 ₽). Высокий винрейт на Mirage."}
            ];
            renderMatches(backupData);
        } else {
            try {
                const matches = JSON.parse(decodeURIComponent(encodedData));
                renderMatches(matches);
            } catch(e) {
                console.log("Ошибка парсинга ссылки, включаем резерв");
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById('matches-list');
            container.innerHTML = ''; 

            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                const verdictClass = match.rec_type === 'P2' ? 'verdict p2' : 'verdict p1';

                card.innerHTML = `
                    <div class="tournament">🏆 ${match.tournament} (${match.format})</div>
                    <div class="teams-container">
                        <div class="team left">${match.t1} <span style="color:#64748b; font-size:13px;">(${match.k1})</span></div>
                        <div class="vs">VS</div>
                        <div class="team right"><span style="color:#64748b; font-size:13px;">(${match.k2})</span> ${match.t2}</div>
                    </div>
                    <div class="odds-bar-container">
                        <div class="bar-t1" style="width: ${match.prob1}%;"></div>
                        <div class="bar-t2" style="width: ${match.prob2}%;"></div>
                    </div>
                    <div class="metrics-grid">
                        <div class="metric-item">Шансы ИИ: <span style="color:#38bdf8">${match.prob1}%</span> / <span style="color:#f43f5e">${match.prob2}%</span></div>
                        <div class="metric-item">Маржа БК: <span>${match.margin}%</span></div>
                        <div class="metric-item">Трансферы: <span>${match.reshuffles}</span></div>
                        <div class="metric-item">Джетлаг: <span>${match.jetlag}</span></div>
                    </div>
                    <div class="${verdictClass}">
                        ${match.verdict}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
