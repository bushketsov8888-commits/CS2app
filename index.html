<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAVARU CS EXPERT v1.0</title>
    <style>
        :root {
            --bg-main: #121316;
            --bg-card: #1a1c22;
            --brand-orange: #ff5500;
            --brand-orange-glow: rgba(255, 85, 0, 0.2);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --accent-green: #00cc66;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #252830;
            padding-bottom: 12px;
        }
        .logo-box h1 { font-size: 18px; font-weight: 800; text-transform: uppercase; }
        .logo-box span { color: var(--brand-orange); text-shadow: 0 0 10px var(--brand-orange-glow); }
        .winrate-badge { background: linear-gradient(135deg, #252830, #1a1c22); border: 1px solid var(--brand-orange); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .winrate-badge em { color: var(--accent-green); font-style: normal; }
        .match-card { background-color: var(--bg-card); border-radius: 14px; border: 1px solid #252830; padding: 16px; margin-bottom: 16px; }
        .match-status { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }
        .status-live { color: var(--brand-orange); display: flex; align-items: center; gap: 4px; }
        .status-live::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--brand-orange); border-radius: 50%; }
        .teams-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .team-row { display: flex; align-items: center; gap: 10px; width: 42%; }
        .team-row.right { flex-direction: row-reverse; text-align: right; }
        .team-logo { width: 36px; height: 36px; background-color: #252830; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; border: 1px solid #323642; }
        .team-name { font-size: 14px; font-weight: 700; }
        .match-score { font-size: 20px; font-weight: 800; text-align: center; width: 16%; }
        .analytics-block { background-color: #121316; border-radius: 10px; padding: 12px; margin-bottom: 12px; border-left: 3px solid var(--brand-orange); }
        .analytics-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .label { color: var(--text-muted); }
        .value { font-weight: 600; }
        .value.highlight { color: var(--brand-orange); }
        .odds-container { display: flex; gap: 8px; }
        .odds-btn { flex: 1; background-color: #252830; border: 1px solid #323642; color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
        .odds-btn span { color: var(--text-muted); font-weight: 400; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-box"><h1>LAVARU <span>CS EXPERT</span></h1></div>
        <div class="winrate-badge">W/R (30д): <em>74.2%</em></div>
    </div>
    <div class="match-card">
        <div class="match-status">
            <span id="match-status-text" class="status-live">Ожидание...</span>
            <span id="tournament-title">CS Match</span>
        </div>
        <div class="teams-container">
            <div class="team-row">
                <div id="team1-logo" class="team-logo">T1</div>
                <div id="team1-name" class="team-name">Команда 1</div>
            </div>
            <div id="match-score" class="match-score">0:0</div>
            <div class="team-row right">
                <div id="team2-logo" class="team-logo">T2</div>
                <div id="team2-name" class="team-name">Команда 2</div>
            </div>
        </div>
        <div class="analytics-block">
            <div class="analytics-row">
                <span class="label">Вероятность (Live + OSINT):</span>
                <span id="analytics-probability" class="value">--% vs --%</span>
            </div>
            <div class="analytics-row">
                <span class="label">Фактор камбэка:</span>
                <span id="analytics-comeback" class="value">Расчет...</span>
            </div>
            <div class="analytics-row">
                <span class="label">Рекомендация:</span>
                <span id="analytics-recommendation" class="value highlight">Обработка...</span>
            </div>
        </div>
        <div class="odds-container">
            <div id="btn-odds-p1" class="odds-btn"><span>П1</span> --</div>
            <div id="btn-odds-p2" class="odds-btn"><span>П2</span> --</div>
        </div>
    </div>
    <script>
        function getAppConfig() {
            const params = new URLSearchParams(window.location.search);
            const rawData = params.get('data');

            if (!rawData) {
                document.getElementById('match-status-text').innerText = "Демо-режим";
                document.getElementById('tournament-title').innerText = "Тестовый Турнир";
                document.getElementById('team1-name').innerText = "FaZe Clan";
                document.getElementById('team2-name').innerText = "G2 Esports";
                document.getElementById('match-score').innerText = "10:7";
                document.getElementById('analytics-probability').innerText = "FaZe 58% vs 42% G2";
                document.getElementById('analytics-comeback').innerText = "Высокий (У G2 сломана экономика)";
                document.getElementById('analytics-recommendation').innerText = "ТБ 21.5 раундов (4.2% от банка)";
                document.getElementById('btn-odds-p1').innerHTML = "<span>П1</span> 1.65";
                document.getElementById('btn-odds-p2').innerHTML = "<span>П2</span> 2.25";
                return;
            }

            try {
                const decodedData = JSON.parse(decodeURIComponent(rawData));
                
                if(decodedData.tournament) document.getElementById('tournament-title').innerText = decodedData.tournament;
                if(decodedData.status_text) document.getElementById('match-status-text').innerText = decodedData.status_text;
                
                const t1 = decodedData.team1 || "Команда 1";
                const t2 = decodedData.team2 || "Команда 2";
                
                if(document.getElementById('team1-name')) document.getElementById('team1-name').innerText = t1;
                if(document.getElementById('team2-name')) document.getElementById('team2-name').innerText = t2;
                if(document.getElementById('team1-logo')) document.getElementById('team1-logo').innerText = t1.substring(0, 4).toUpperCase();
                if(document.getElementById('team2-logo')) document.getElementById('team2-logo').innerText = t2.substring(0, 4).toUpperCase();
                
                if(decodedData.score) document.getElementById('match-score').innerText = decodedData.score;
                if(decodedData.p1_percent) document.getElementById('analytics-probability').innerText = `${decodedData.p1_percent}% vs ${decodedData.p2_percent}%`;
                if(decodedData.comeback_factor) document.getElementById('analytics-comeback').innerText = decodedData.comeback_factor;
                if(decodedData.recommendation) document.getElementById('analytics-recommendation').innerText = decodedData.recommendation;
                
                if(decodedData.odds_p1) document.getElementById('btn-odds-p1').innerHTML = `<span>П1</span> ${decodedData.odds_p1}`;
                if(decodedData.odds_p2) document.getElementById('btn-odds-p2').innerHTML = `<span>П2</span> ${decodedData.odds_p2}`;
                
                if (decodedData.user_id) {
                    const watermark = document.createElement('div');
                    watermark.style.position = 'fixed';
                    watermark.style.top = '50%';
                    watermark.style.left = '50%';
                    watermark.style.transform = 'translate(-50%, -50%) rotate(-45deg)';
                    watermark.style.opacity = '0.02';
                    watermark.style.fontSize = '24px';
                    watermark.style.fontWeight = '800';
                    watermark.style.color = '#ffffff';
                    watermark.style.pointerEvents = 'none';
                    watermark.style.zIndex = '1';
                    watermark.style.whiteSpace = 'nowrap';
                    watermark.innerText = 'LAVARU SYSTEM · ID ' + decodedData.user_id;
                    document.body.appendChild(watermark);
                }
                
            } catch (error) {
                console.error("Ошибка парсинга:", error);
                document.getElementById('match-status-text').innerText = "Ошибка разбора";
            }
        }

        window.addEventListener('DOMContentLoaded', getAppConfig);
    </script>
</body>
</html>
